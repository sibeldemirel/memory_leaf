version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: memoryleaf-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    container_name: memoryleaf-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: memoryleaf-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - mongodb
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: memoryleaf-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    command: npm run dev

  pgadmin:
      image: dpage/pgadmin4
      container_name: memoryleaf-pgadmin
      restart: unless-stopped
      environment:
        PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_USER}
        PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PASSWORD}
      ports:
        - "5050:80"
      depends_on:
        - postgres
      volumes:
        - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  mongodata:
  pgadmin_data: